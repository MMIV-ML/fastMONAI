name: fastmonai
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # torch must come from the CPU index, to keep CUDA wheels and several GB of
    # nvidia-* packages out of a CPU-only image. monai 1.6.0 requires torch>=2.8, so a
    # conda pytorch/cpuonly pin below that is silently overridden by pip.
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==2.12.1+cpu
    - torchvision==0.27.1+cpu
    # fastMONAI 0.10.0 contains the versioned model-spec registry and strict
    # Safetensors model loader used by new bundles. Keep the deployment stack pinned;
    # requirements plus the built image digest are the runtime contract.
    - fastMONAI==0.10.0
    - fastai==2.8.7
    - monai==1.6.0
    - torchio==1.2.1
    - safetensors==0.7.0
    - pydicom==2.4.5
