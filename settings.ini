[DEFAULT]
# All sections below are required unless otherwise specified
# see https://github.com/fastai/nbdev/blob/master/settings.ini for examples

### Python Library ###
lib_name = fastMONAI
min_python = 3.10
version = 0.13.0
### OPTIONAL ###

requirements = fastai>=2.8.6 monai>=1.5.2 torchio>=1.2.1 xlrd>=2.0.1 scikit-image>=0.23.2,<2 imagedata>=3.8.14 mlflow>=3.14 ipython huggingface-hub gdown plum-dispatch<2.10 safetensors>=0.7.0
dev_requirements = ipywidgets nbdev<3 execnb<0.2 fastcore<2 pytest

### nbdev ###
nbs_path = nbs
doc_path = _docs
recursive = False
tst_flags = notest

### Documentation ###
host = github
repo = fastMONAI
branch = main
custom_sidebar = True
jupyter_hooks = True
clean_ids = False
black_formatting = False
readme_nb = index.ipynb
allowed_metadata_keys =
allowed_cell_metadata_keys =

### PyPI ### 
audience = Developers
author = Satheshkumar Kaliyugarasan
author_email = skaliyugarasan@hotmail.com
copyright = 2022 onwards, Mohn Medical Imaging and Visualization Centre
description = A low-code deep learning library for 3D medical image analysis, built on fastai, MONAI and TorchIO
keywords = deep learning, medical imaging
language = English
license = apache2
status = 2
user = MMIV-ML

### Inferred From Other Values ###
doc_host =  https://fastmonai.no
doc_baseurl = /
git_url = https://github.com/MMIV-ML/fastMONAI
lib_path = %(lib_name)s
title = %(lib_name)s
